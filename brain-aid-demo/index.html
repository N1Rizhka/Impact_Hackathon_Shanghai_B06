<html lang="en">
<head>

  <title>Brain Aid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1f1a;
      --pine: #114b3a;
      --pine-deep: #0a3227;
      --foam: #e8f3ee;
      --amber: #e8a838;
      --coral: #e06b4a;
      --sky: #7eb8c9;
      --muted: #5a736a;
      --stroke: rgba(17, 75, 58, 0.14);
      --panel: rgba(244, 250, 247, 0.88);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Manrope', sans-serif;
      --sidebar: 232px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1000px 600px at 0% 0%, rgba(126,184,201,.35), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(232,168,56,.22), transparent 50%),
        linear-gradient(165deg, #eef7f3, #f7fbf9 50%, #e6f0eb);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
    .shell.welcome-mode { grid-template-columns: 1fr; }

    .sidebar {
      padding: 22px 16px;
      border-right: 1px solid var(--stroke);
      background: rgba(244,250,247,.72);
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; gap: 18px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      border: 0; background: transparent; padding: 4px;
      color: var(--pine); font-family: var(--font-display);
      font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em;
    }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: 14px; background: rgba(255,255,255,.55);
      border: 1px solid var(--stroke);
    }
    .user-chip strong { display: block; font-size: .95rem; }
    .user-chip span { color: var(--muted); font-size: .78rem; }
    .nav { display: grid; gap: 6px; }
    .nav button {
      text-align: left; border: 0; background: transparent;
      padding: 11px 12px; border-radius: 12px; color: var(--pine-deep);
      font-weight: 650;
    }
    .nav button:hover, .nav button.active { background: rgba(17,75,58,.1); }
    .nav button.active { color: var(--pine); }
    .side-foot { margin-top: auto; color: var(--muted); font-size: .72rem; line-height: 1.4; }

    .main { padding: 22px clamp(16px, 3vw, 32px) 40px; overflow: auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .topbar h1 {
      margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.1rem);
      letter-spacing: -.03em; color: var(--pine-deep);
    }
    .topbar p { margin: 4px 0 0; color: var(--muted); }

    .btn {
      border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700;
      transition: .15s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.primary { background: var(--pine); color: #f4faf7; box-shadow: 0 10px 24px rgba(17,75,58,.2); }
    .btn.primary:hover:not(:disabled) { background: var(--pine-deep); }
    .btn.ghost { background: transparent; color: var(--pine); border: 1px solid var(--stroke); }
    .btn.amber { background: var(--amber); color: var(--pine-deep); }
    .btn.danger { background: transparent; color: var(--coral); border: 1px solid rgba(224,107,74,.35); }
    .btn.sm { padding: 8px 12px; font-size: .88rem; }

    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card {
      background: var(--panel); border: 1px solid var(--stroke);
      border-radius: 20px; padding: 18px;
    }
    .card h3 { margin: 0 0 6px; font-family: var(--font-display); color: var(--pine-deep); }
    .card p { margin: 0; color: var(--muted); line-height: 1.45; }
    .card.clickable { cursor: pointer; transition: .15s ease; }
    .card.clickable:hover { border-color: rgba(17,75,58,.35); transform: translateY(-2px); }

    .eyebrow {
      margin: 0 0 6px; text-transform: uppercase; letter-spacing: .1em;
      font-size: .7rem; font-weight: 700; color: var(--muted);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px; padding: 5px 10px; font-size: .75rem; font-weight: 700;
      background: rgba(232,168,56,.2); color: var(--pine-deep);
    }
    .pill.green { background: rgba(17,75,58,.12); color: var(--pine); }
    .pill.sky { background: rgba(126,184,201,.25); }

    .avatar {
      border-radius: 50%; color: #fff; display: grid; place-items: center;
      font-weight: 800; font-family: var(--font-display);
      box-shadow: 0 0 0 3px rgba(244,250,247,.9); flex-shrink: 0;
    }

    .welcome {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .welcome-card {
      width: min(560px, 100%); background: var(--panel);
      border: 1px solid var(--stroke); border-radius: 28px; padding: clamp(24px, 4vw, 40px);
      animation: rise .4s ease both;
    }
    .welcome-card h1 {
      margin: 10px 0 8px; font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 3.6rem); letter-spacing: -.04em; color: var(--pine-deep);
    }
    .welcome-card .lede { color: var(--muted); line-height: 1.55; margin: 0 0 22px; }

    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label {
      font-size: .78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
    }
    .field input, .field select, .field textarea {
      border: 1px solid var(--stroke); border-radius: 14px;
      padding: 12px 14px; background: rgba(255,255,255,.75); color: var(--ink); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: rgba(17,75,58,.45);
    }
    .field textarea { min-height: 80px; resize: vertical; }

    .member-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 14px;
      background: rgba(255,255,255,.55); border: 1px solid var(--stroke);
      margin-bottom: 8px;
    }
    .member-row .meta { flex: 1; min-width: 0; }
    .member-row strong { display: block; }
    .member-row span { color: var(--muted); font-size: .82rem; }
    .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-row input { flex: 1; min-width: 140px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--stroke); background: rgba(255,255,255,.6);
      border-radius: 999px; padding: 8px 12px; font-weight: 650; color: var(--pine-deep);
    }
    .chip.on { background: var(--pine); color: #f4faf7; border-color: var(--pine); }

    .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .mode-btn {
      text-align: left; border: 1px solid var(--stroke); background: rgba(255,255,255,.6);
      border-radius: 16px; padding: 14px; 
    }
    .mode-btn strong { display: block; margin-bottom: 4px; color: var(--pine-deep); }
    .mode-btn span { color: var(--muted); font-size: .86rem; }
    .mode-btn:hover { border-color: rgba(17,75,58,.35); }

    .passage {
      background: #fff; border: 1px solid var(--stroke); border-radius: 16px;
      padding: 20px; line-height: 1.85; font-size: 1.05rem;
    }
    .word {
      display: inline; border: 0; padding: 0; margin: 0;
      background: transparent; color: inherit; font: inherit;
      cursor: pointer; border-radius: 3px; white-space: pre-wrap;
    }
    .word:hover { background: rgba(17,75,58,.07); }
    .word.caught { background: rgba(17,75,58,.1); padding: 0 2px; }
    .word.caught s { opacity: .5; margin-right: 3px; }
    .word.caught b { color: var(--pine); font-weight: 800; }
    .toast { min-height: 1.3em; margin-top: 10px; font-weight: 650; font-size: .92rem; }
    .toast.bad { color: var(--coral); }
    .toast.ok { color: var(--pine); }

    .meter {
      height: 8px; border-radius: 99px; background: rgba(17,75,58,.12); overflow: hidden; flex: 1;
    }
    .meter > div {
      height: 100%; background: linear-gradient(90deg, var(--amber), var(--pine));
      transition: width .3s ease;
    }
    .hunt-status { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: var(--muted); }

    .flash {
      width: min(100%, 440px); height: 220px; margin: 0 auto; perspective: 1000px;
      border: 0; background: transparent; position: relative;
    }
    .flash-face {
      position: absolute; inset: 0; border-radius: 18px; padding: 22px;
      display: flex; flex-direction: column; justify-content: space-between;
      backface-visibility: hidden; transition: transform .5s ease; border: 1px solid var(--stroke);
    }
    .flash-face.front { background: #fff; }
    .flash-face.back { background: var(--pine); color: var(--foam); transform: rotateY(180deg); }
    .flash.is-flipped .front { transform: rotateY(180deg); }
    .flash.is-flipped .back { transform: rotateY(360deg); }
    .flash-face p { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }

    .quiz-opt {
      display: block; width: 100%; text-align: left; margin-bottom: 8px;
      border: 1px solid var(--stroke); background: #fff; border-radius: 14px; padding: 12px 14px;
    }
    .quiz-opt.on { background: var(--pine); color: #fff; border-color: var(--pine); }
    .quiz-opt.bad { background: rgba(224,107,74,.12); border-color: var(--coral); }

    .rank li {
      display: grid; grid-template-columns: 36px 40px 1fr auto; gap: 10px;
      align-items: center; list-style: none; padding: 10px 12px; margin-bottom: 8px;
      border-radius: 14px; background: rgba(255,255,255,.55); border: 1px solid var(--stroke);
    }
    .rank { margin: 0; padding: 0; }
    .rank li.you { background: rgba(232,168,56,.18); border-color: rgba(232,168,56,.4); }
    .rank .place { font-family: var(--font-display); font-weight: 800; color: var(--pine); }

    .empty {
      padding: 28px; text-align: center; color: var(--muted);
      border: 1px dashed var(--stroke); border-radius: 18px;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .rise { animation: rise .35s ease both; }

    @media (max-width: 920px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        border-right: 0; border-bottom: 1px solid var(--stroke);
        flex-direction: row; flex-wrap: wrap; align-items: center;
      }
      .nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .side-foot, .user-chip span { display: none; }
      .split, .grid.cols-2, .grid.cols-3, .mode-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    let state = load();

    function load() {
      try {
        const raw = localStorage.getItem('brain-aid-v2');
        if (!raw) return defaultState();
        return { ...defaultState(), ...JSON.parse(raw) };
      } catch {
        return defaultState();
      }
    }
    function save() {
      localStorage.setItem('brain-aid-v2', JSON.stringify({
        userName: state.userName,
        friends: state.friends,
        rooms: state.rooms,
      }));
    }

    function uid() { return 'id-' + Math.random().toString(36).slice(2, 9); }

        <path d="M24.8 33.2c-3.6.2-6.3 3-6.3 6.4 0 1.5.5 2.8 1.5 3.8-.5.6-.8 1.4-.8 2.2 0 2 1.6 3.6 3.6 3.6h.6c.5 1.5 1.9 2.6 3.6 2.6 1.2 0 2.2-.5 2.9-1.4.6.9 1.7 1.4 2.9 1.4 1.7 0 3.1-1.1 3.6-2.6h.6c2 0 3.6-1.6 3.6-3.6 0-.8-.3-1.6-.8-2.2 1-1 1.5-2.3 1.5-3.8 0-3.4-2.7-6.2-6.3-6.4-1.4-.1-2.7.4-3.8 1.2-1.1-.8-2.4-1.3-3.8-1.2z" fill="#114B3A"/>
        <circle cx="48" cy="24" r="10" fill="#E06B4A"/>
        <path d="M48 18.2v11.6M42.2 24h11.6" stroke="#FFF7F4" stroke-width="3.2" stroke-linecap="round"/>
      </svg>`;
    }

    function activeRoom() {
      return state.rooms.find(r => r.id === state.activeRoomId) || null;
    }

    function setView(view, extra = {}) {
      Object.assign(state, extra, { view, toast: '' });
      render();
    }

    function render() {
      const app = document.getElementById('app');
      if (!state.userName || state.view === 'welcome') {
        app.innerHTML = renderWelcome();
        bindWelcome();
        return;
      }
      app.innerHTML = `
        <div class="shell">
          ${renderSidebar()}
          <div class="main rise">${renderMain()}</div>
        </div>`;
      bindApp();
    }

    function renderWelcome() {
      return `<div class="welcome">
        <div class="welcome-card">
          ${logo(72)}
          <p class="eyebrow">Lifelong learning, with your people</p>
          <h1>Brain Aid</h1>
          <p class="lede">Create study rooms, invite your crew, set a commitment plan, and learn with AI modes that make you prove understanding — including hunting mistakes the model plants on purpose.</p>
          <div class="field">
            <label for="yourName">Your name</label>
            <input id="yourName" maxlength="24" placeholder="e.g. Alex" value="${escapeHtml(state.userName)}" />
          </div>
          <button type="button" class="btn primary" id="enterApp">Open Brain Aid</button>
        </div>
      </div>`;
    }

    function bindWelcome() {
      document.getElementById('enterApp').onclick = () => {
        const name = document.getElementById('yourName').value.trim();
        if (!name) return document.getElementById('yourName').focus();
        state.userName = name;
        state.view = 'home';
        save();
        render();
      };
    }

    function renderSidebar() {
      const items = [
        ['home', 'Home'],
        ['rooms', 'My rooms'],
        ['create', 'Create room'],
        ['friends', 'Friends'],
        ['discover', 'Topics'],
      ];
      return `<aside class="sidebar">
        <button type="button" class="brand" data-nav="home">${logo(28)} Brain Aid</button>
        <div class="user-chip">
          ${avatar(state.userName, COLORS[0], 36)}
          <div><strong>${escapeHtml(state.userName)}</strong><span>${state.rooms.length} rooms · ${state.friends.length} friends</span></div>
        </div>
        <nav class="nav">
          ${items.map(([id, label]) => `<button type="button" class="${state.view === id || (id==='rooms' && state.view==='room') ? 'active' : ''}" data-nav="${id}">${label}</button>`).join('')}
        </nav>
        <div class="side-foot">Hackathon concept draft · data stays in this browser</div>
      </aside>`;
    }

    function renderMain() {
      switch (state.view) {
        case 'home': return renderHome();
        case 'rooms': return renderRoomsList();
        case 'create': return renderCreate();
        case 'room': return renderRoom();
        case 'session': return renderSession();
        case 'friends': return renderFriends();
        case 'discover': return renderDiscover();
        default: return renderHome();
      }
    }

    function renderHome() {
      const recent = [...state.rooms].slice(-3).reverse();
      return `
        <div class="topbar">
          <div>
            <h1>Hey, ${escapeHtml(state.userName)}</h1>
            <p>Pick up a room, start a new crew, or explore a topic.</p>
          </div>
          <button type="button" class="btn primary" data-nav="create">Create room</button>
        </div>
        <div class="grid cols-3" style="margin-bottom:18px">
          <div class="card"><p class="eyebrow">Rooms</p><h3>${state.rooms.length}</h3><p>Active study circles</p></div>
          <div class="card"><p class="eyebrow">Friends</p><h3>${state.friends.length}</h3><p>People you can invite</p></div>
          <div class="card"><p class="eyebrow">Topics</p><h3>${Object.keys(TOPICS).length}</h3><p>Built-in learning packs</p></div>
        </div>
        <div class="split">
          <div>
            <p class="eyebrow">Continue</p>
            ${recent.length ? recent.map(roomCard).join('') : `<div class="empty">No rooms yet. Create one with your team.</div>`}
          </div>
          <div>
            <p class="eyebrow">Suggested topics</p>
            ${Object.values(TOPICS).map(t => `
              <div class="card clickable" style="margin-bottom:10px" data-create-topic="${t.id}">
                <h3>${escapeHtml(t.title)}</h3>
                <p>${escapeHtml(t.blurb)}</p>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function roomCard(r) {
      const topic = TOPICS[r.topicId];
      return `<div class="card clickable" style="margin-bottom:10px" data-open-room="${r.id}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div>
            <p class="eyebrow">${escapeHtml(r.teamName)}</p>
            <h3>${escapeHtml(topic?.title || r.topicId)}</h3>
            <p>${r.period} days · ${r.members.length} members · quizzes ${r.quizEvery === 1 ? 'daily' : 'every ' + r.quizEvery + ' days'}</p>
          </div>
          <span class="pill green">${r.methods.length} modes</span>
        </div>
        <div style="display:flex;gap:6px;margin-top:12px">
          ${r.members.slice(0,5).map(m => avatar(m.name, m.color, 28)).join('')}
        </div>
      </div>`;
    }

    function renderRoomsList() {
      return `
        <div class="topbar">
          <div><h1>My rooms</h1><p>All your study circles in one place.</p></div>
          <button type="button" class="btn primary" data-nav="create">New room</button>
        </div>
        ${state.rooms.length ? `<div class="grid cols-2">${state.rooms.map(roomCard).join('')}</div>` : `<div class="empty">You haven’t created a room yet.</div>`}`;
    }

    function renderCreate() {
      const d = state.draft || freshDraft();
      state.draft = d;
      return `
        <div class="topbar">
          <div><h1>Create a room</h1><p>Name your team, invite people, lock a plan.</p></div>
        </div>
        <div class="split">
          <div class="card">
            <div class="field">
              <label>Team / room name</label>
              <input id="teamName" maxlength="40" value="${escapeHtml(d.teamName)}" placeholder="Night owls bio crew" />
            </div>
            <div class="field">
              <label>Topic pack</label>
              <select id="topicId">
                ${Object.values(TOPICS).map(t => `<option value="${t.id}" ${d.topicId===t.id?'selected':''}>${escapeHtml(t.title)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Commitment period</label>
              <div class="chips" id="periodChips">
                ${PERIODS.map(p => `<button type="button" class="chip ${d.period===p?'on':''}" data-period="${p}">${p} days</button>`).join('')}
              </div>
            </div>
            <div class="field">
              <label>Learning methods</label>
              <div class="chips" id="methodChips">
                ${METHODS.map(m => `<button type="button" class="chip ${d.methods.includes(m.id)?'on':''}" data-method="${m.id}">${m.label}</button>`).join('')}
              </div>
            </div>
            <div class="field">
              <label>Quiz frequency</label>
              <select id="quizEvery">
                <option value="1" ${d.quizEvery===1?'selected':''}>Every day</option>
                <option value="2" ${d.quizEvery===2?'selected':''}>Every 2 days</option>
                <option value="3" ${d.quizEvery===3?'selected':''}>Twice a week</option>
              </select>
            </div>
          </div>
          <div class="card">
            <p class="eyebrow">Team</p>
            <h3 style="margin-bottom:12px">Who’s in this room?</h3>
            <div class="member-row">
              ${avatar(state.userName, COLORS[0], 36)}
              <div class="meta"><strong>${escapeHtml(state.userName)}</strong><span>you · host</span></div>
            </div>
            <div id="draftMembers">
              ${d.members.map((m, i) => `
                <div class="member-row">
                  ${avatar(m.name, m.color, 36)}
                  <div class="meta"><strong>${escapeHtml(m.name)}</strong><span>teammate</span></div>
                  <button type="button" class="btn sm danger" data-remove-member="${i}">Remove</button>
                </div>`).join('')}
            </div>
            <div class="add-row" style="margin-top:10px">
              <input id="newMember" maxlength="24" placeholder="Add teammate name" />
              <button type="button" class="btn ghost" id="addMember">Add</button>
            </div>
            ${state.friends.length ? `
              <p class="eyebrow" style="margin-top:16px">From friends</p>
              <div class="chips">
                ${state.friends.map(f => `<button type="button" class="chip" data-invite-friend="${escapeHtml(f.name)}">${escapeHtml(f.name)}</button>`).join('')}
              </div>` : ''}
            <div class="actions">
              <button type="button" class="btn ghost" data-nav="home">Cancel</button>
              <button type="button" class="btn primary" id="saveRoom">Create room</button>
            </div>
          </div>
        </div>`;
    }

    function freshDraft(topicId = 'photosynthesis') {
      return {
        teamName: '',
        topicId,
        period: 14,
        methods: ['flashcards', 'errorHunt', 'quiz'],
        quizEvery: 2,
        members: [],
      };
    }

    function renderRoom() {
      const room = activeRoom();
      if (!room) return `<div class="empty">Room not found.</div>`;
      const topic = TOPICS[room.topicId];
      const rankings = buildRankings(room);
      return `
        <div class="topbar">
          <div>
            <p class="eyebrow">${escapeHtml(room.teamName)}</p>
            <h1>${escapeHtml(topic.title)}</h1>
            <p>${room.period}-day plan · ${room.members.length} people · ${room.methods.map(m => METHODS.find(x=>x.id===m)?.label).filter(Boolean).join(' · ')}</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn ghost" data-nav="rooms">All rooms</button>
            <button type="button" class="btn danger sm" id="deleteRoom">Delete</button>
          </div>
        </div>
        <div class="split">
          <div>
            <div class="card" style="margin-bottom:14px">
              <p class="eyebrow">Start learning</p>
              <h3>Choose a mode — or let confidence pick</h3>
              <p style="margin:8px 0 14px">Modes unlocked for this room:</p>
              <div class="mode-grid">
                ${room.methods.map(id => {
                  const m = METHODS.find(x => x.id === id);
                  return `<button type="button" class="mode-btn" data-start-mode="${id}"><strong>${m.label}</strong><span>${m.blurb}</span></button>`;
                }).join('')}
              </div>
              <div class="field" style="margin-top:16px;margin-bottom:0">
                <label>Your confidence today (for auto-pick)</label>
                <input type="range" id="conf" min="1" max="5" value="3" />
              </div>
              <div class="actions" style="justify-content:flex-start">
                <button type="button" class="btn amber" id="autoStart">Auto-pick mode</button>
              </div>
            </div>
            <div class="card">
              <p class="eyebrow">Room plan</p>
              <div class="grid cols-2">
                <div><strong>${room.period} days</strong><p>Commitment window</p></div>
                <div><strong>${room.quizEvery === 1 ? 'Daily' : 'Every ' + room.quizEvery + ' days'}</strong><p>Quiz cadence</p></div>
              </div>
              <p style="margin-top:12px">${escapeHtml(topic.blurb)}</p>
            </div>
          </div>
          <div>
            <div class="card" style="margin-bottom:14px">
              <p class="eyebrow">Team</p>
              ${room.members.map(m => `
                <div class="member-row">
                  ${avatar(m.name, m.color, 36)}
                  <div class="meta"><strong>${escapeHtml(m.name)}</strong><span>${m.role}</span></div>
                </div>`).join('')}
            </div>
            <div class="card">
              <p class="eyebrow">Commitment board</p>
              <ol class="rank">
                ${rankings.map((r, i) => `
                  <li class="${r.isYou ? 'you' : ''}">
                    <span class="place">#${i+1}</span>
                    ${avatar(r.name, r.color, 34)}
                    <div><strong>${escapeHtml(r.name)}</strong><div style="color:var(--muted);font-size:.82rem">${r.label}</div></div>
                    <div style="text-align:right;font-family:var(--font-display);font-weight:800;color:var(--pine-deep)">${r.score}</div>
                  </li>`).join('')}
              </ol>
            </div>
          </div>
        </div>`;
    }

    function buildRankings(room) {
      return room.members.map((m, i) => {
        const isYou = m.role === 'you · host';
        const base = 70 + ((m.name.length * 7 + i * 11) % 25);
        const bonus = isYou ? (room.sessionsCompleted || 0) * 4 : 0;
        return {
          name: m.name,
          color: m.color,
          isYou,
          score: Math.min(99, base + bonus),
          label: isYou ? (room.sessionsCompleted ? 'Rising fast' : 'Getting started') : ['Steady', 'Quiz beast', 'Night owl'][i % 3],
        };
      }).sort((a, b) => b.score - a.score);
    }

    function startSession(mode) {
      const room = activeRoom();
      if (!room) return;
      const topic = TOPICS[room.topicId];
      state.session = {
        roomId: room.id,
        mode,
        topicId: room.topicId,
        cardIdx: 0,
        flipped: false,
        found: [],
        quizIdx: 0,
        quizPick: null,
        quizScore: 0,
        explainText: '',
        explainDone: false,
        toast: '',
        step: mode === 'flashcards' ? 'cards' : mode === 'errorHunt' ? 'hunt' : mode === 'quiz' ? 'quiz' : 'explain',
      };
      state.view = 'session';
      render();
    }

    function renderSession() {
      const s = state.session;
      const room = state.rooms.find(r => r.id === s.roomId);
      const topic = TOPICS[s.topicId];
      if (!s || !room || !topic) return `<div class="empty">Session missing.</div>`;

      let body = '';
      if (s.mode === 'flashcards') body = renderFlashSession(topic, s);
      if (s.mode === 'errorHunt') body = renderHuntSession(topic, s);
      if (s.mode === 'quiz') body = renderQuizSession(topic, s);
      if (s.mode === 'explain') body = renderExplainSession(topic, s);

      return `
        <div class="topbar">
          <div>
            <p class="eyebrow">Session · ${METHODS.find(m => m.id === s.mode)?.label}</p>
            <h1>${escapeHtml(topic.title)}</h1>
            <p>${escapeHtml(room.teamName)}</p>
          </div>
          <button type="button" class="btn ghost" id="exitSession">Back to room</button>
        </div>
        <div class="card">${body}</div>`;
    }

    function renderFlashSession(topic, s) {
      const card = topic.flashcards[s.cardIdx];
      const last = s.cardIdx === topic.flashcards.length - 1;
      return `
        <button type="button" class="flash ${s.flipped ? 'is-flipped' : ''}" id="flashCard">
          <div class="flash-face front"><span>Card ${s.cardIdx+1}/${topic.flashcards.length}</span><p>${escapeHtml(card.front)}</p><em>Tap to flip</em></div>
          <div class="flash-face back"><span>Answer</span><p>${escapeHtml(card.back)}</p></div>
        </button>
        <div class="actions" style="justify-content:center">
          <button type="button" class="btn ghost" id="prevCard" ${s.cardIdx===0?'disabled':''}>Prev</button>
          ${last
            ? `<button type="button" class="btn primary" id="finishSession">Finish session</button>`
            : `<button type="button" class="btn primary" id="nextCard">Next</button>`}
        </div>`;
    }

    function renderHuntSession(topic, s) {
      const caught = s.found.length;
      const done = caught >= topic.errorCount;
      const passage = topic.errorPassage.map((tok, i) => {
        if (tok.ok) {
          return `<button type="button" class="word" data-word="${i}">${escapeHtml(tok.t)}</button>`;
        }
        if (s.found.includes(tok.id)) {
          return `<button type="button" class="word caught" data-word="${i}"><s>${escapeHtml(tok.t)}</s> <b>${escapeHtml(tok.fix)}</b></button>`;
        }
        return `<button type="button" class="word" data-word="${i}">${escapeHtml(tok.t)}</button>`;
      }).join('');

      return `
        <p style="margin:0 0 10px;color:var(--muted)">Tap any word you think is wrong. Nothing is highlighted until you catch it. Wrong taps get a nudge.</p>
        <div class="passage">${passage}</div>
        <div class="toast ${s.toast?.startsWith('Caught') || s.toast?.startsWith('Nice') ? 'ok' : 'bad'}" id="huntToast">${escapeHtml(s.toast || '')}</div>
        <div class="hunt-status">
          <div class="meter"><div style="width:${(caught/topic.errorCount)*100}%"></div></div>
          <span>${caught}/${topic.errorCount} mistakes caught</span>
        </div>
        ${done ? `<div class="actions"><button type="button" class="btn primary" id="finishSession">Finish session</button></div>` : ''}`;
    }

    function renderQuizSession(topic, s) {
      if (s.quizIdx >= topic.quiz.length) {
        return `<h3>Quiz complete</h3><p>You scored ${s.quizScore}/${topic.quiz.length}.</p>
          <div class="actions"><button type="button" class="btn primary" id="finishSession">Back to room board</button></div>`;
      }
      const item = topic.quiz[s.quizIdx];
      return `
        <p class="eyebrow">Question ${s.quizIdx+1}/${topic.quiz.length}</p>
        <h3 style="margin-bottom:12px">${escapeHtml(item.q)}</h3>
        ${item.options.map((opt, i) => {
          let cls = 'quiz-opt';
          if (s.quizPick !== null && i === s.quizPick) cls += i === item.answer ? ' on' : ' bad';
          if (s.quizPick !== null && i === item.answer) cls += ' on';
          return `<button type="button" class="${cls}" data-quiz-opt="${i}" ${s.quizPick!==null?'disabled':''}>${escapeHtml(opt)}</button>`;
        }).join('')}
        ${s.quizPick !== null ? `<div class="actions"><button type="button" class="btn primary" id="nextQuiz">Continue</button></div>` : ''}`;
    }

    function renderExplainSession(topic, s) {
      if (s.explainDone) {
        return `<h3>Explain-back reviewed</h3><p>${escapeHtml(s.toast)}</p>
          <div class="actions"><button type="button" class="btn primary" id="finishSession">Finish session</button></div>`;
      }
      return `
        <p class="eyebrow">Explain-back</p>
        <h3 style="margin-bottom:10px">${escapeHtml(topic.explainPrompt)}</h3>
        <div class="field"><textarea id="explainBox" placeholder="Write freely…">${escapeHtml(s.explainText)}</textarea></div>
        <div class="actions"><button type="button" class="btn primary" id="submitExplain">Check understanding</button></div>`;
    }

    function renderFriends() {
      return `
        <div class="topbar">
          <div><h1>Friends</h1><p>Save people you often study with, then invite them into rooms.</p></div>
        </div>
        <div class="split">
          <div class="card">
            <div class="add-row">
              <input id="friendName" maxlength="24" placeholder="Friend’s name" />
              <button type="button" class="btn primary" id="addFriend">Add friend</button>
            </div>
            <div style="margin-top:16px">
              ${state.friends.length ? state.friends.map((f, i) => `
                <div class="member-row">
                  ${avatar(f.name, f.color, 36)}
                  <div class="meta"><strong>${escapeHtml(f.name)}</strong><span>friend</span></div>
                  <button type="button" class="btn sm danger" data-remove-friend="${i}">Remove</button>
                </div>`).join('') : `<div class="empty">No friends saved yet.</div>`}
            </div>
          </div>
          <div class="card">
            <h3>How invites work (demo)</h3>
            <p>This draft keeps friends locally in your browser. When you create a room, tap a friend chip to add them to the team instantly.</p>
          </div>
        </div>`;
    }

    function renderDiscover() {
      return `
        <div class="topbar">
          <div><h1>Topic packs</h1><p>Start a room from a ready-made learning pack.</p></div>
        </div>
        <div class="grid cols-3">
          ${Object.values(TOPICS).map(t => `
            <div class="card">
              <p class="eyebrow">${t.tags.join(' · ')}</p>
              <h3>${escapeHtml(t.title)}</h3>
              <p style="margin-bottom:14px">${escapeHtml(t.blurb)}</p>
              <button type="button" class="btn primary sm" data-create-topic="${t.id}">Use this topic</button>
            </div>`).join('')}
        </div>`;
    }

    function finishSession() {
      const room = state.rooms.find(r => r.id === state.session.roomId);
      if (room) {
        room.sessionsCompleted = (room.sessionsCompleted || 0) + 1;
        save();
      }
      state.session = null;
      state.view = 'room';
      render();
    }

    function bindApp() {
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.onclick = () => {
          const v = btn.getAttribute('data-nav');
          if (v === 'create') state.draft = freshDraft(state.draft?.topicId || 'photosynthesis');
          setView(v);
        };
      });

      document.querySelectorAll('[data-open-room]').forEach(el => {
        el.onclick = () => {
          state.activeRoomId = el.getAttribute('data-open-room');
          setView('room');
        };
      });

      document.querySelectorAll('[data-create-topic]').forEach(el => {
        el.onclick = () => {
          state.draft = freshDraft(el.getAttribute('data-create-topic'));
          setView('create');
        };
      });

      // Create room bindings
      const teamName = document.getElementById('teamName');
      if (teamName) {
        teamName.oninput = () => { state.draft.teamName = teamName.value; };
        document.getElementById('topicId').onchange = (e) => { state.draft.topicId = e.target.value; };
        document.getElementById('quizEvery').onchange = (e) => { state.draft.quizEvery = Number(e.target.value); };
        document.querySelectorAll('[data-period]').forEach(btn => {
          btn.onclick = () => { state.draft.period = Number(btn.getAttribute('data-period')); render(); };
        });
        document.querySelectorAll('[data-method]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-method');
            const d = state.draft;
            if (d.methods.includes(id)) {
              if (d.methods.length === 1) return;
              d.methods = d.methods.filter(m => m !== id);
            } else d.methods.push(id);
            render();
          };
        });
        document.getElementById('addMember').onclick = () => {
          const input = document.getElementById('newMember');
          const name = input.value.trim();
          if (!name) return;
          if (name.toLowerCase() === state.userName.toLowerCase()) return;
          if (state.draft.members.some(m => m.name.toLowerCase() === name.toLowerCase())) return;
          state.draft.members.push({ name, color: COLORS[(state.draft.members.length + 1) % COLORS.length] });
          render();
        };
        document.querySelectorAll('[data-remove-member]').forEach(btn => {
          btn.onclick = () => {
            state.draft.members.splice(Number(btn.getAttribute('data-remove-member')), 1);
            render();
          };
        });
        document.querySelectorAll('[data-invite-friend]').forEach(btn => {
          btn.onclick = () => {
            const name = btn.getAttribute('data-invite-friend');
            if (state.draft.members.some(m => m.name.toLowerCase() === name.toLowerCase())) return;
            const friend = state.friends.find(f => f.name === name);
            state.draft.members.push({ name, color: friend?.color || COLORS[2] });
            render();
          };
        });
        document.getElementById('saveRoom').onclick = () => {
          const d = state.draft;
          if (!d.teamName.trim()) {
            document.getElementById('teamName').focus();
            return;
          }
          const room = {
            id: uid(),
            teamName: d.teamName.trim(),
            topicId: d.topicId,
            period: d.period,
            methods: [...d.methods],
            quizEvery: d.quizEvery,
            sessionsCompleted: 0,
            members: [
              { name: state.userName, color: COLORS[0], role: 'you · host' },
              ...d.members.map(m => ({ ...m, role: 'teammate' })),
            ],
          };
          state.rooms.push(room);
          state.activeRoomId = room.id;
          state.draft = null;
          save();
          setView('room');
        };
      }

      document.getElementById('deleteRoom')?.addEventListener('click', () => {
        state.rooms = state.rooms.filter(r => r.id !== state.activeRoomId);
        state.activeRoomId = null;
        save();
        setView('rooms');
      });

      document.querySelectorAll('[data-start-mode]').forEach(btn => {
        btn.onclick = () => startSession(btn.getAttribute('data-start-mode'));
      });
      document.getElementById('autoStart')?.addEventListener('click', () => {
        const room = activeRoom();
        const conf = Number(document.getElementById('conf').value);
        let mode = room.methods[0];
        if (conf <= 2 && room.methods.includes('flashcards')) mode = 'flashcards';
        else if (conf >= 4 && room.methods.includes('errorHunt')) mode = 'errorHunt';
        else if (room.methods.includes('quiz')) mode = 'quiz';
        else if (room.methods.includes('explain')) mode = 'explain';
        startSession(mode);
      });

      // Session
      document.getElementById('exitSession')?.addEventListener('click', () => {
        state.session = null;
        setView('room');
      });
      document.getElementById('flashCard')?.addEventListener('click', () => {
        state.session.flipped = !state.session.flipped;
        render();
      });
      document.getElementById('prevCard')?.addEventListener('click', () => {
        state.session.cardIdx = Math.max(0, state.session.cardIdx - 1);
        state.session.flipped = false;
        render();
      });
      document.getElementById('nextCard')?.addEventListener('click', () => {
        state.session.cardIdx += 1;
        state.session.flipped = false;
        render();
      });
      document.getElementById('finishSession')?.addEventListener('click', finishSession);

      document.querySelectorAll('[data-word]').forEach(btn => {
        btn.onclick = () => {
          const topic = TOPICS[state.session.topicId];
          const tok = topic.errorPassage[Number(btn.getAttribute('data-word'))];
          if (!tok) return;
          if (tok.ok) {
            state.session.toast = 'That part looks fine — keep hunting.';
          } else if (state.session.found.includes(tok.id)) {
            state.session.toast = 'Already caught.';
          } else {
            state.session.found.push(tok.id);
            state.session.toast = `Caught it → ${tok.fix}`;
          }
          render();
        };
      });

      document.querySelectorAll('[data-quiz-opt]').forEach(btn => {
        btn.onclick = () => {
          const topic = TOPICS[state.session.topicId];
          const item = topic.quiz[state.session.quizIdx];
          const pick = Number(btn.getAttribute('data-quiz-opt'));
          state.session.quizPick = pick;
          if (pick === item.answer) state.session.quizScore += 1;
          render();
        };
      });
      document.getElementById('nextQuiz')?.addEventListener('click', () => {
        state.session.quizIdx += 1;
        state.session.quizPick = null;
        render();
      });

      document.getElementById('submitExplain')?.addEventListener('click', () => {
        const topic = TOPICS[state.session.topicId];
        const text = document.getElementById('explainBox').value.trim();
        state.session.explainText = text;
        const lower = text.toLowerCase();
        const hits = topic.explainKeywords.filter(k => lower.includes(k.toLowerCase()));
        state.session.explainDone = true;
        state.session.toast = hits.length >= 2
          ? `Nice — you hit ${hits.length}/${topic.explainKeywords.length} key ideas (${hits.join(', ')}).`
          : `Thin on key ideas. Try covering more of: ${topic.explainKeywords.join(', ')}.`;
        render();
      });

      // Friends
      document.getElementById('addFriend')?.addEventListener('click', () => {
        const name = document.getElementById('friendName').value.trim();
        if (!name) return;
        if (state.friends.some(f => f.name.toLowerCase() === name.toLowerCase())) return;
        state.friends.push({ name, color: COLORS[(state.friends.length + 2) % COLORS.length] });
        save();
        render();
      });
      document.querySelectorAll('[data-remove-friend]').forEach(btn => {
        btn.onclick = () => {
          state.friends.splice(Number(btn.getAttribute('data-remove-friend')), 1);
          save();
          render();
        };
      });
    }

    render();
  </script>
</body>
</html>
